    <i>Italic</i>

    <!-- If you want to write a sub or super sccript for example writing formula like h2o-->
    <br>
    <p>Wrong way of writing formula : <b>H2O</b> </p>
    <p>Right way of writing formula : <b>H<sub>2</sub>O</b></p>
